apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-demo
  template:
    metadata:
      labels:
        app: argocd-demo
    spec:
      containers:
      - name: argocd-demo
        image: kaisarkhan1981/argocd-demo
        image: kaisarkhan1981/argocd-demo:fc3c5742b970210eacd542f778df652588b28d1c
        ports:
        - containerPort: 3000
