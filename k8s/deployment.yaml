apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-demo
  template:
    metadata:
      labels:
        app: argocd-demo
    spec:
      containers:
      - name: argocd-demo
        image: kaisarkhan1981/argocd-demo
        image: kaisarkhan1981/argocd-demo:f2e3d3c5aeca773e02488b0c2737386ae355bffa
        ports:
        - containerPort: 3000
